<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" rx="30" fill="#3498db"/>
  
  <!-- Newspaper icon -->
  <g transform="translate(40, 40)">
    <!-- Paper -->
    <rect x="20" y="20" width="136" height="136" rx="8" fill="white"/>
    
    <!-- Text lines -->
    <rect x="35" y="40" width="80" height="8" rx="4" fill="#2c3e50"/>
    <rect x="35" y="58" width="106" height="6" rx="3" fill="#7f8c8d"/>
    <rect x="35" y="72" width="106" height="6" rx="3" fill="#7f8c8d"/>
    <rect x="35" y="86" width="60" height="6" rx="3" fill="#7f8c8d"/>
    
    <!-- Image placeholder -->
    <rect x="35" y="104" width="45" height="35" rx="4" fill="#ecf0f1"/>
    
    <!-- More text -->
    <rect x="90" y="104" width="51" height="6" rx="3" fill="#7f8c8d"/>
